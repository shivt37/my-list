name: Generate TMDB Discover lists

on:
  schedule:
    # Deliberately ONCE daily at 05:30 IST (= 00:00 UTC), NOT twice like
    # the other modules (owner decision 2026-09-01, F14): the 12:00 UTC
    # run stays commented out on purpose. GitHub Actions cron runs on UTC,
    # so IST inputs need a -5:30 offset. Full regenerate - every run
    # regenerates from scratch; sourceHash is stamped onto each data
    # file for diffing/audit only.
    - cron: "0 0 * * *"
    #- cron: "0 12 * * *"

  workflow_dispatch:
    inputs:
      ids:
        description: "Catalog ids to generate (comma-separated, blank = all enabled)"
        required: false
        default: ""
      action:
        description: "generate | delete"
        required: false
        default: "generate"
        type: choice
        options:
          - generate
          - delete
      delete_ids:
        description: "Catalog ids to delete when action=delete (comma-separated)"
        required: false
        default: ""
      config_version:
        description: "configVersion the save expects (12-hex; worker stamps it; blank = skip wait)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tmdb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Shared with scrape.yml/official.yml/simkl.yml - all write data/ and
      # POST run records, so they serialize.
      group: my-list-scrape
      cancel-in-progress: false
      # queue: max added 2026-05 GitHub feature. Without it, when 3 crons
      # fire at the same minute only the first acquires the lock and the
      # other 2 queue as pending - but the default queue depth is 1, so
      # the 2nd pending run gets CANCELED when the 3rd arrives. queue: max
      # lifts that to 100 pending slots, so all 3 fire sequentially with
      # none dropping. Requires cancel-in-progress: false (already set).
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sanitize workflow inputs
        id: sanitize
        run: |
          # Whitelist to [a-z0-9,_-]; --ids only ever carries
          # tmdb_discover_<movie|series>_<8 alnum> plus commas.
          SANITIZED_IDS=$(printf '%s' "${{ github.event.inputs.ids }}" | tr -cd 'a-z0-9,_-')
          SANITIZED_DELETE=$(printf '%s' "${{ github.event.inputs.delete_ids }}" | tr -cd 'a-z0-9,_-')
          SANITIZED_ACTION=$(printf '%s' "${{ github.event.inputs.action }}" | tr -cd 'a-z_')
          SANITIZED_VERSION=$(printf '%s' "${{ github.event.inputs.config_version }}" | tr -cd 'a-f0-9')
          echo "ids=$SANITIZED_IDS" >> "$GITHUB_OUTPUT"
          echo "delete_ids=$SANITIZED_DELETE" >> "$GITHUB_OUTPUT"
          echo "action=$SANITIZED_ACTION" >> "$GITHUB_OUTPUT"
          echo "config_version=$SANITIZED_VERSION" >> "$GITHUB_OUTPUT"

      # F3: config_version wait (exact content hash) + the legacy id grep.
      - name: Wait for KV consistency
        if: ${{ steps.sanitize.outputs.ids != '' || steps.sanitize.outputs.config_version != '' }}
        env:
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_IDS: ${{ steps.sanitize.outputs.ids }}
          INPUT_VERSION: ${{ steps.sanitize.outputs.config_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            CONFIG=$(curl -sf "${WORKER_ORIGIN}/export-config" || echo '{}')
            MISSING=false
            if [ -n "$INPUT_VERSION" ]; then
              V=$(echo "$CONFIG" | grep -o '"configVersion": *"[^"]*"' | grep -o '[a-f0-9]\{12\}' || echo "")
              if [ "$V" != "$INPUT_VERSION" ]; then
                MISSING=true
              fi
            fi
            if [ "$MISSING" = false ] && [ -n "$INPUT_IDS" ]; then
              IFS=',' read -ra IDS <<< "$INPUT_IDS"
              for id in "${IDS[@]}"; do
                # Dispatched IDs are tmdb_discover_{type}_{8-char-hash};
                # config stores discoverListId as the 8-char hash.
                HASH=$(echo "$id" | sed 's/^tmdb_discover_[a-z]*_//')
                if ! echo "$CONFIG" | grep -q "\"${HASH}\""; then
                  MISSING=true
                  break
                fi
              done
            fi
            if [ "$MISSING" = false ]; then
              echo "Config ready (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Config not ready yet - waiting 20s for KV propagation..."
              sleep 20
            fi
          done
          echo "ERROR: config still stale after 5 attempts - aborting instead of running with old settings."
          exit 1

      - name: Generate TMDB discover lists
        working-directory: scripts
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_IDS: ${{ steps.sanitize.outputs.ids }}
          INPUT_ACTION: ${{ steps.sanitize.outputs.action }}
          INPUT_DELETE_IDS: ${{ steps.sanitize.outputs.delete_ids }}
        run: |
          ARGS=()
          [ -n "${INPUT_ACTION}" ] && ARGS+=("--action=${INPUT_ACTION}")
          if [ "${INPUT_ACTION}" = "delete" ]; then
            [ -n "${INPUT_DELETE_IDS}" ] && ARGS+=("--delete_ids=${INPUT_DELETE_IDS}")
          else
            [ -n "${INPUT_IDS}" ] && ARGS+=("--ids=${INPUT_IDS}")
          fi
          node tmdb.mjs "${ARGS[@]}"

      - name: Commit data changes
        if: always()
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add -f 'data/*.json'
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): refresh TMDB discover lists [skip ci]"
            # Rebase onto whatever landed (other bots' data commits,
            # deploys, manual pushes) - a bare push races and loses this
            # run's data. -X theirs: on a content conflict (two runs
            # refreshed the same catalog file, e.g. a UI re-run checking
            # out its original older SHA) the just-regenerated data wins -
            # these files are throwaway artifacts, never hand-edited.
            git pull --rebase -X theirs
            git push
          fi
