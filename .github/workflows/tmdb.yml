name: Generate TMDB Discover lists

on:
  schedule:
    # Daily at 05:30 IST (= 00:00 UTC), matching the other modules' first
    # run. GitHub Actions cron runs on UTC, so IST inputs need a -5:30
    # offset. Full regenerate - every run regenerates from scratch;
    # sourceHash is stamped onto each data file for diffing/audit only.
    - cron: "0 0 * * *"
    #- cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      ids:
        description: "Catalog ids to generate (comma-separated, blank = all enabled)"
        required: false
        default: ""
      action:
        description: "generate | delete"
        required: false
        default: "generate"
        type: choice
        options:
          - generate
          - delete
      delete_ids:
        description: "Catalog ids to delete when action=delete (comma-separated)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tmdb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Shared with scrape.yml/official.yml/simkl.yml - all write data/ and
      # POST run records, so they serialize.
      group: my-list-scrape
      cancel-in-progress: false
      # queue: max added 2026-05 GitHub feature. Without it, when 3 crons
      # fire at the same minute only the first acquires the lock and the
      # other 2 queue as pending - but the default queue depth is 1, so
      # the 2nd pending run gets CANCELED when the 3rd arrives. queue: max
      # lifts that to 100 pending slots, so all 3 fire sequentially with
      # none dropping. Requires cancel-in-progress: false (already set).
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sanitize workflow inputs
        id: sanitize
        run: |
          # Whitelist to [a-z0-9,_-]; --ids only ever carries
          # tmdb_discover_<movie|series>_<8 alnum> plus commas.
          SANITIZED_IDS=$(printf '%s' "${{ github.event.inputs.ids }}" | tr -cd 'a-z0-9,_-')
          SANITIZED_DELETE=$(printf '%s' "${{ github.event.inputs.delete_ids }}" | tr -cd 'a-z0-9,_-')
          SANITIZED_ACTION=$(printf '%s' "${{ github.event.inputs.action }}" | tr -cd 'a-z_')
          echo "ids=$SANITIZED_IDS" >> "$GITHUB_OUTPUT"
          echo "delete_ids=$SANITIZED_DELETE" >> "$GITHUB_OUTPUT"
          echo "action=$SANITIZED_ACTION" >> "$GITHUB_OUTPUT"

      - name: Generate TMDB discover lists
        working-directory: scripts
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_IDS: ${{ steps.sanitize.outputs.ids }}
          INPUT_ACTION: ${{ steps.sanitize.outputs.action }}
          INPUT_DELETE_IDS: ${{ steps.sanitize.outputs.delete_ids }}
        run: |
          ARGS=()
          [ -n "${INPUT_ACTION}" ] && ARGS+=("--action=${INPUT_ACTION}")
          if [ "${INPUT_ACTION}" = "delete" ]; then
            [ -n "${INPUT_DELETE_IDS}" ] && ARGS+=("--delete_ids=${INPUT_DELETE_IDS}")
          else
            [ -n "${INPUT_IDS}" ] && ARGS+=("--ids=${INPUT_IDS}")
          fi
          node tmdb.mjs "${ARGS[@]}"

      - name: Commit data changes
        if: always()
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add -f 'data/*.json'
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): refresh TMDB discover lists [skip ci]"
            # Rebase onto whatever landed (other bots' data commits,
            # deploys, manual pushes) - a bare push races and loses this
            # run's data. -X theirs: on a content conflict (two runs
            # refreshed the same catalog file, e.g. a UI re-run checking
            # out its original older SHA) the just-regenerated data wins -
            # these files are throwaway artifacts, never hand-edited.
            git pull --rebase -X theirs
            git push
          fi
