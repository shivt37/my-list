name: Refresh MDBList official lists

on:
  schedule:
    # Every 12 hours (UTC). Edit this line on github.com to change the
    # schedule - per-page cron, separate from scrape.yml.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Official slugs to refresh (comma-separated, blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Shared with scrape.yml - both write data/ and POST run records, so
      # they serialize. Without this the KV read-modify-write in addRun and
      # the data-commit step could race and lose runs.
      group: my-list-scrape
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanitize workflow inputs
        id: sanitize
        run: |
          # Whitelist to [a-z0-9,_-]; --slugs only ever carries fixed slugs
          # (popular, justwatch-streaming-charts, moviemeter) plus comma
          # separator - drop everything else before bash sees it.
          SANITIZED_SLUGS=$(printf '%s' "${{ github.event.inputs.slugs }}" | tr -cd 'a-z0-9,_-')
          echo "slugs=$SANITIZED_SLUGS" >> "$GITHUB_OUTPUT"

      - name: Run official lists fetcher
        working-directory: scripts
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          INPUT_SLUGS: ${{ steps.sanitize.outputs.slugs }}
        run: |
          ARGS=()
          [ -n "${INPUT_SLUGS}" ] && ARGS+=("--slugs=${INPUT_SLUGS}")
          node official.mjs "${ARGS[@]}"

      - name: Commit data changes
        if: always()
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): refresh official lists [skip ci]"
            # Rebase onto whatever landed (worker deploy commits, manual
            # pushes) - a bare push races and loses this run's data.
            git pull --rebase
            git push
          fi
