name: Refresh MDBList official lists

on:
  schedule:
    # Daily at 05:30 and 17:30 IST (= 00:00 and 12:00 UTC). Edit these
    # lines on github.com to change the schedule - per-page cron, separate
    # from scrape.yml. GitHub Actions cron runs on UTC, so IST inputs need
    # a -5:30 offset.
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Official slugs to refresh (comma-separated, blank = all enabled)"
        required: false
        default: ""
      action:
        description: "refresh (default) or delete data files for delete_ids"
        required: false
        default: "refresh"
        type: choice
        options:
          - refresh
          - delete
      delete_ids:
        description: "Catalog ids to delete when action=delete (mdboff_<slug>_<movie|show>, comma-separated)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  official:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Shared with scrape.yml - both write data/ and POST run records, so
      # they serialize. Without this the KV read-modify-write in addRun and
      # the data-commit step could race and lose runs.
      group: my-list-scrape
      cancel-in-progress: false
      # queue: max added 2026-05 GitHub feature. Without it, when 3 crons
      # fire at the same minute only the first acquires the lock and the
      # other 2 queue as pending - but the default queue depth is 1, so
      # the 2nd pending run gets CANCELED when the 3rd arrives. queue: max
      # lifts that to 100 pending slots, so all 3 fire sequentially with
      # none dropping. Requires cancel-in-progress: false (already set).
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sanitize workflow inputs
        id: sanitize
        run: |
          # Whitelist to [a-z0-9,_-]; slugs/delete_ids only ever carry
          # official slug chars plus the comma separator - drop everything
          # else before bash sees it. action is a GH choice input (safe).
          SANITIZED_SLUGS=$(printf '%s' "${{ github.event.inputs.slugs }}" | tr -cd 'a-z0-9,_-')
          SANITIZED_ACTION=$(printf '%s' "${{ github.event.inputs.action }}" | tr -cd 'a-z')
          SANITIZED_DEL=$(printf '%s' "${{ github.event.inputs.delete_ids }}" | tr -cd 'a-z0-9,_-')
          [ -z "$SANITIZED_ACTION" ] && SANITIZED_ACTION="refresh"
          echo "slugs=$SANITIZED_SLUGS" >> "$GITHUB_OUTPUT"
          echo "action=$SANITIZED_ACTION" >> "$GITHUB_OUTPUT"
          echo "delete_ids=$SANITIZED_DEL" >> "$GITHUB_OUTPUT"

      - name: Run official lists fetcher / deleter
        working-directory: scripts
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_SLUGS: ${{ steps.sanitize.outputs.slugs }}
          INPUT_ACTION: ${{ steps.sanitize.outputs.action }}
          INPUT_DEL: ${{ steps.sanitize.outputs.delete_ids }}
        run: |
          ARGS=()
          if [ "${INPUT_ACTION}" = "delete" ]; then
            ARGS+=("--action=delete")
            [ -n "${INPUT_DEL}" ] && ARGS+=("--delete-ids=${INPUT_DEL}")
          else
            [ -n "${INPUT_SLUGS}" ] && ARGS+=("--slugs=${INPUT_SLUGS}")
          fi
          node official.mjs "${ARGS[@]}"

      - name: Commit data changes
        if: always()
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add -f 'data/*.json'
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): sync official lists [skip ci]"
            # Rebase onto whatever landed (other bots' data commits,
            # deploys, manual pushes) - a bare push races and loses this
            # run's data. -X theirs: on a content conflict (two runs
            # refreshed the same catalog file, e.g. a UI re-run checking
            # out its original older SHA) the just-regenerated data wins -
            # these files are throwaway artifacts, never hand-edited.
            git pull --rebase -X theirs
            git push
          fi
