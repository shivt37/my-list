name: Refresh SIMKL Arriving Today

on:
  schedule:
    # Every 12 hours (UTC). Edit this line on github.com to change the
    # schedule - per-page cron, separate from scrape.yml and official.yml.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      kinds:
        description: "SIMKL kinds to refresh (comma-separated: series,anime, blank = all enabled)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  simkl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Shared with scrape.yml + official.yml - all three write data/ and
      # POST run records, so they serialize.
      group: my-list-scrape
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run SIMKL arriving-today fetcher
        working-directory: scripts
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
        run: |
          # Inputs flow via env, not inline shell - the bash array quoting
          # keeps a crafted kinds value from injecting into the shell.
          ARGS=()
          if [ -n "${{ github.event.inputs.kinds }}" ]; then
            ARGS+=("--kinds=${{ github.event.inputs.kinds }}")
          fi
          node simkl.mjs "${ARGS[@]}"

      - name: Commit data changes
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): refresh simkl arriving today [skip ci]"
            # Rebase onto whatever landed (worker deploy commits, manual
            # pushes) - a bare push races and loses this run's data.
            git pull --rebase
            git push
          fi