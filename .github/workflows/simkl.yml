name: Refresh SIMKL Arriving Today

on:
  schedule:
    # Daily at 05:30 and 17:30 IST (= 00:00 and 12:00 UTC). Edit these
    # lines on github.com to change the schedule - per-page cron, separate
    # from scrape.yml and official.yml. GitHub Actions cron runs on UTC,
    # so IST inputs need a -5:30 offset.
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      kinds:
        description: "SIMKL kinds to refresh (comma-separated: series,anime, blank = all enabled)"
        required: false
        default: ""
      config_version:
        description: "configVersion the save expects (12-hex; worker stamps it; blank = skip wait)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  simkl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Shared with scrape.yml + official.yml - all three write data/ and
      # POST run records, so they serialize.
      group: my-list-scrape
      cancel-in-progress: false
      # queue: max added 2026-05 GitHub feature. Without it, when 3 crons
      # fire at the same minute only the first acquires the lock and the
      # other 2 queue as pending - but the default queue depth is 1, so
      # the 2nd pending run gets CANCELED when the 3rd arrives. queue: max
      # lifts that to 100 pending slots, so all 3 fire sequentially with
      # none dropping. Requires cancel-in-progress: false (already set).
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sanitize workflow inputs
        id: sanitize
        run: |
          # kinds is one of: series, anime, series,anime. Whitelist to
          # [a-z,] only. config_version is a 12-hex content hash.
          SANITIZED_KINDS=$(printf '%s' "${{ github.event.inputs.kinds }}" | tr -cd 'a-z,')
          SANITIZED_VERSION=$(printf '%s' "${{ github.event.inputs.config_version }}" | tr -cd 'a-f0-9')
          echo "kinds=$SANITIZED_KINDS" >> "$GITHUB_OUTPUT"
          echo "config_version=$SANITIZED_VERSION" >> "$GITHUB_OUTPUT"

      # F3: simkl reads filters + timezone from /export-config - wait
      # (bounded) until the config version this save dispatched for is
      # visible, else a stale KV read applies the OLD filters to the run.
      - name: Wait for KV consistency
        if: ${{ steps.sanitize.outputs.config_version != '' }}
        env:
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_VERSION: ${{ steps.sanitize.outputs.config_version }}
        run: |
          for attempt in 1 2 3; do
            VERSION=$(curl -sf "${WORKER_ORIGIN}/export-config" | grep -o '"configVersion":"[^"]*"' | cut -d'"' -f4 || echo "")
            if [ "$VERSION" = "$INPUT_VERSION" ]; then
              echo "Config ready (attempt $attempt)"
              exit 0
            fi
            echo "Config version $INPUT_VERSION not visible yet (saw '${VERSION:-none}') - waiting 20s..."
            sleep 20
          done
          echo "ERROR: config still stale after 3 attempts - aborting instead of applying old filters."
          exit 1

      - name: Run SIMKL arriving-today fetcher
        working-directory: scripts
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_KINDS: ${{ steps.sanitize.outputs.kinds }}
        run: |
          ARGS=()
          [ -n "${INPUT_KINDS}" ] && ARGS+=("--kinds=${INPUT_KINDS}")
          node simkl.mjs "${ARGS[@]}"

      - name: Commit data changes
        if: always()
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add -f 'data/*.json'
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): refresh simkl arriving today [skip ci]"
            # Rebase onto whatever landed (other bots' data commits,
            # deploys, manual pushes) - a bare push races and loses this
            # run's data. -X theirs: on a content conflict (two runs
            # refreshed the same catalog file, e.g. a UI re-run checking
            # out its original older SHA) the just-regenerated data wins -
            # these files are throwaway artifacts, never hand-edited.
            git pull --rebase -X theirs
            git push
          fi