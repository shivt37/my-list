name: Scrape MDBList lists

on:
  schedule:
    # Daily at 05:30 and 17:30 IST (= 00:00 and 12:00 UTC). Edit these
    # lines on github.com to change the schedule - no worker-side timing
    # involved. GitHub Actions cron runs on UTC, so IST inputs need a
    # -5:30 offset.
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      lists:
        description: "List ids to scrape (comma-separated, blank = all enabled)"
        required: false
        default: ""
      action:
        description: "scrape (default) or scrape_delete"
        required: false
        default: "scrape"
      delete_ids:
        description: "List ids whose data files should be deleted (comma-separated)"
        required: false
        default: ""
      config_version:
        description: "configVersion the save expects (12-hex; worker stamps it; blank = skip wait)"
        required: false
        default: ""
      debug:
        description: "Dump page HTML/screenshots for troubleshooting"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Shared with official.yml - both write data/ and POST run records, so
      # they serialize. Without this the KV read-modify-write in addRun and
      # the data-commit step could race and lose runs.
      group: my-list-scrape
      cancel-in-progress: false
      # queue: max added 2026-05 GitHub feature. Without it, when 3 crons
      # fire at the same minute only the first acquires the lock and the
      # other 2 queue as pending - but the default queue depth is 1, so
      # the 2nd pending run gets CANCELED when the 3rd arrives. queue: max
      # lifts that to 100 pending slots, so all 3 fire sequentially with
      # none dropping. Requires cancel-in-progress: false (already set).
      queue: max
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Sanitize workflow inputs
        id: sanitize
        # Strict whitelist per arg; any char outside [a-zA-Z0-9,_-]/[a-zA-Z]
        # drops the arg entirely. Done before the script sees it - a `$(...)`
        # payload can't reach bash with the inner expansion evaluated.
        # debug arrives as "true"/"false" (boolean input), not "1"/"0" -
        # a [01] whitelist would strip it to empty and kill --debug.
        run: |
          SANITIZED_ACTION=$(printf '%s' "${{ github.event.inputs.action }}" | tr -cd 'a-zA-Z0-9_-')
          SANITIZED_LISTS=$(printf '%s' "${{ github.event.inputs.lists }}" | tr -cd 'a-zA-Z0-9,_-')
          SANITIZED_DEL=$(printf '%s' "${{ github.event.inputs.delete_ids }}" | tr -cd 'a-zA-Z0-9,_-')
          SANITIZED_DEBUG=$(printf '%s' "${{ github.event.inputs.debug }}" | tr -cd 'a-zA-Z')
          SANITIZED_VERSION=$(printf '%s' "${{ github.event.inputs.config_version }}" | tr -cd 'a-f0-9')
          [ -z "$SANITIZED_ACTION" ] && SANITIZED_ACTION="scrape"
          echo "action=$SANITIZED_ACTION" >> "$GITHUB_OUTPUT"
          echo "lists=$SANITIZED_LISTS" >> "$GITHUB_OUTPUT"
          echo "delete_ids=$SANITIZED_DEL" >> "$GITHUB_OUTPUT"
          echo "debug=$SANITIZED_DEBUG" >> "$GITHUB_OUTPUT"
          echo "config_version=$SANITIZED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for KV consistency
        # Cloudflare KV is eventually consistent: when save-config
        # dispatches this workflow, the KV write may not have propagated
        # to the replica that /export-config reads from. This manifests
        # as "No enabled lists to scrape" when specific --lists IDs are
        # dispatched but the config still shows the pre-save state.
        # Only fires on dispatch-triggered runs with explicit list IDs
        # (cron runs scrape all enabled, no ID mismatch possible).
        # F3: when config_version is present, ALSO wait for the exact
        # version - the id grep below only catches newly-added ids, not
        # edits to existing ones (same id, changed URL/pages).
        if: ${{ steps.sanitize.outputs.lists != '' || steps.sanitize.outputs.config_version != '' }}
        env:
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          INPUT_LISTS: ${{ steps.sanitize.outputs.lists }}
          INPUT_VERSION: ${{ steps.sanitize.outputs.config_version }}
        run: |
          for attempt in 1 2 3; do
            CONFIG=$(curl -sf "${WORKER_ORIGIN}/export-config" || echo '{}')
            MISSING=false
            if [ -n "$INPUT_VERSION" ]; then
              V=$(echo "$CONFIG" | grep -o '"configVersion": *"[^"]*"' | grep -o '[a-f0-9]\{12\}' || echo "")
              if [ "$V" != "$INPUT_VERSION" ]; then
                MISSING=true
              fi
            fi
            if [ "$MISSING" = false ] && [ -n "$INPUT_LISTS" ]; then
              IFS=',' read -ra IDS <<< "$INPUT_LISTS"
              for id in "${IDS[@]}"; do
                if ! echo "$CONFIG" | grep -q "\"$id\""; then
                  MISSING=true
                  break
                fi
              done
            fi
            if [ "$MISSING" = false ]; then
              echo "Config ready (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Config not ready yet - waiting 20s for KV propagation..."
              sleep 20
            fi
          done
          echo "ERROR: config still stale after 3 attempts - aborting instead of running with old settings."
          exit 1

      - name: Run scraper
        working-directory: scripts
        env:
          WORKER_ORIGIN: ${{ secrets.WORKER_ORIGIN }}
          # MDBLIST_API_KEY deliberately NOT mounted here: the DOM scraper
          # never calls the MDBList API - only official.yml uses the key.
          INPUT_ACTION: ${{ steps.sanitize.outputs.action }}
          INPUT_LISTS: ${{ steps.sanitize.outputs.lists }}
          INPUT_DEL: ${{ steps.sanitize.outputs.delete_ids }}
          INPUT_DEBUG: ${{ steps.sanitize.outputs.debug }}
        run: |
          # Inputs reached bash only after char-class sanitization - no
          # quoting escape can turn a sanitized string back into a
          # shell expression.
          ARGS=("--action=${INPUT_ACTION}")
          [ -n "${INPUT_LISTS}" ] && ARGS+=("--lists=${INPUT_LISTS}")
          [ -n "${INPUT_DEL}" ] && ARGS+=("--delete-ids=${INPUT_DEL}")
          [ "${INPUT_DEBUG}" = "true" ] && ARGS+=("--debug")
          node scrape.mjs "${ARGS[@]}"

      - name: Commit data changes
        # Always commit, even if the scraper step exited 1 - that's exactly
        # when a successful scrape's output must be saved. Without this,
        # one failed page or a /runs POST error throws away every good file.
        if: always()
        run: |
          git config user.name "my-list-bot"
          git config user.email "my-list-bot@users.noreply.github.com"
          git add -f 'data/*.json'
          if git diff --cached --quiet; then
            echo "No data changes - skipping commit."
          else
            git commit -m "chore(data): refresh scraper lists [skip ci]"
            # Rebase onto whatever landed (other bots' data commits,
            # deploys, manual pushes) - a bare push races and loses this
            # run's data. -X theirs: on a content conflict (two runs
            # refreshed the same catalog file, e.g. a UI re-run checking
            # out its original older SHA) the just-regenerated data wins -
            # these files are throwaway artifacts, never hand-edited.
            git pull --rebase -X theirs
            git push
          fi

      - name: Upload debug artifacts
        if: ${{ github.event.inputs.debug == 'true' || failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: scraper-debug-${{ github.run_id }}
          path: scripts/debug/*
          if-no-files-found: ignore
          retention-days: 7
